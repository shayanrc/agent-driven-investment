[project]
name = "agent-driven-investment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arch>=8.0.0",
    "catboost>=1.2.7",
    "holidays>=0.97",
    # jugaad-data is vendored at vendor/jugaad-data (git subtree) so we can
    # patch the broken niftyindices.com index endpoint that upstream hasn't
    # fixed (cinfo parameter shape change, ~mid-2026). Upstream version is
    # 0.33.1; see vendor/jugaad-data/README.md for sync notes.
    "jugaad-data",
    "matplotlib>=3.10.9",
    "nselib>=2.5.1",
    "numpy>=2.4.5",
    "pandas>=3.0.3",
    # V1.4 (date-aligned splits): NYSE / NSE trading calendars for
    # universe-level segment-window dispatch. See
    # docs/gbdt/V1.4_date_aligned_splits_plan.md §4.4.
    "pandas-market-calendars>=4.4.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "threadpoolctl>=3.6.0",
    "xgboost>=3.2.0",
    "yfinance>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analog_mc", "src/backtesting", "src/data_pipelines", "src/forecasters", "src/gbdt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: tests that require the real on-disk data_pipelines cache and/or take >5s",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
jugaad-data = { path = "vendor/jugaad-data", editable = true }
