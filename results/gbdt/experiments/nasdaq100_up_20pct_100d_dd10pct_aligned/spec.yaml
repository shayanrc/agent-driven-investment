target:
  universe: nasdaq100
  direction: up
  threshold_pct: 20
  horizon_days: 100
  max_drawdown: 0.1
split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 200
  min_train_rows_per_ticker: 200
backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
    callback_mode: default
date_range:
  end: 2026-06-04
