experiment_name: russell1000_up_50pct_200d_dd25pct_aligned_agent_v14p1
target:
  universe: russell1000
  direction: up
  threshold_pct: 50
  horizon_days: 200
  max_drawdown: 0.25
split:
  mode: date_aligned
  train_start: 2018-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 300
  min_train_rows_per_ticker: 200
  min_rows_per_ticker: 2000
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  scout:
    enabled: true
    per_config_timeout_seconds: 120
    wall_clock_cap_seconds: 1800
  fs_prefit:
    enabled: true
    cliff_pct: 0.01
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
    degenerate_sink_threshold: 1.05
    tie_band: 0.005
random_seed: 42
date_range:
  end: 2026-05-22
