experiment_name: nasdaq100_up_10pct_50d_dd5pct_b_acceptance_agent
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 10
  horizon_days: 50
  max_drawdown: 0.05
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  scout:
    enabled: true
  fs_prefit:
    enabled: true
    cliff_pct: 0.01
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
    degenerate_sink_threshold: 1.05
    tie_band: 0.005
random_seed: 42
date_range:
  end: 2026-06-04
