experiment_name: nifty500_up_10pct_10d_dd5pct_aligned
target:
  universe: nifty500
  direction: up
  threshold_pct: 10
  horizon_days: 10
  max_drawdown: 0.05
split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 100
  min_train_rows_per_ticker: 200
  min_rows_per_ticker: 1600
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
date_range:
  end: 2026-05-22
