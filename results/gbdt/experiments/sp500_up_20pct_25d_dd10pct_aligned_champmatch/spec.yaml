experiment_name: sp500_up_20pct_25d_dd10pct_aligned_champmatch
target:
  universe: sp500
  direction: up
  threshold_pct: 20
  horizon_days: 25
  max_drawdown: 0.1
split:
  mode: date_aligned
  train_start: '2019-01-01'
features:
  candidates: all
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  hp_starting:
    min_child_weight: 10
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
date_range:
  end: 2026-06-20
