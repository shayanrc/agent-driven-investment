# v2.2 acceptance preset: v2.1 (trailing-momentum drift) PLUS conditional block
# sampling. Identical knobs to nasdaq100_v21.yaml + conditional_block_sampling.
# Used for the v2.2 acceptance gate (acf_seam_degradation stops firing AND mean
# CRPS not worse than v2.1).

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 10
n_blocks: 6
n_paths: 500

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.2
n_eff_values: [30, 80]
local_refine_top_k: 3
nelder_mead_xatol: 0.02
nelder_mead_maxiter: 20

vol_clip_lower: 0.5
vol_clip_upper: 3.0
drift_mode: trailing_momentum
momentum_lookback: 20
momentum_shrinkage: 0.5
conditional_block_sampling: true
conditional_block_sampling_in_search: false  # contingency: search uses v1 sampling for speed; test eval gets conditional benefit

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 99
runs_dir: runs/analog_mc
