# Ablation Cell C — conditional block sampling WITHOUT trailing-momentum drift.
# Identical to nasdaq100_v22.yaml except drift_mode is zero, so the 2x2
# (drift, conditional) factorial at fast-preset resolution has all four cells:
#   A = nasdaq100_fast.yaml         (zero,           false)
#   B = nasdaq100_v21.yaml          (trailing_mom,   false)
#   C = THIS FILE                   (zero,           true)
#   D = nasdaq100_v22.yaml          (trailing_mom,   true)
# Cell C isolates the conditional-sampling effect from the drift effect and
# lets us compute the interaction term (D-B) - (C-A).

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 10
n_blocks: 6
n_paths: 500

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.2
n_eff_values: [30, 80]
local_refine_top_k: 3
nelder_mead_xatol: 0.02
nelder_mead_maxiter: 20

vol_clip_lower: 0.5
vol_clip_upper: 3.0
drift_mode: zero
momentum_lookback: 20      # unused with drift_mode=zero; kept for config-equality with other presets
momentum_shrinkage: 0.5    # unused with drift_mode=zero
conditional_block_sampling: true
conditional_block_sampling_in_search: false  # search uses v1 sampling (cheap); test eval gets conditional

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
