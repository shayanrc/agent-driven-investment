# E9-A: GARCH-conditional resampling + zero drift + no conditional analog sampling.
# Tests the core v3b effect: does per-step GARCH σ injection close the
# acf_seam_degradation rule when the rest of the pipeline is at v1 baseline?
#
# Compares directly against E1-bl10 (= v1 fast preset).

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 10
n_blocks: 6
n_paths: 500

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.2
n_eff_values: [30, 80]
local_refine_top_k: 3
nelder_mead_xatol: 0.02
nelder_mead_maxiter: 20

vol_clip_lower: 0.5
vol_clip_upper: 3.0
drift_mode: zero
momentum_lookback: 20
momentum_shrinkage: 0.5

vol_model: garch  # E9 — GARCH-conditional rescaling per-step

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
