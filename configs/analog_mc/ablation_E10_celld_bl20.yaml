# E10: Cell D × bl=20.
# Post-E1 follow-up. E1 showed CRPS improves monotonically with longer blocks at
# zero-drift baseline (bl=20: 0.0506 vs bl=10: 0.0521). This config tests whether
# that gain stacks with Cell D (drift + conditional sampling), or whether the
# mechanisms overlap.
#
# Identical to nasdaq100_v22.yaml except block_length=20, n_blocks=3.

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 20
n_blocks: 3
n_paths: 500

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.2
n_eff_values: [30, 80]
local_refine_top_k: 3
nelder_mead_xatol: 0.02
nelder_mead_maxiter: 20

vol_clip_lower: 0.5
vol_clip_upper: 3.0
drift_mode: trailing_momentum
momentum_lookback: 20
momentum_shrinkage: 0.5
conditional_block_sampling: true
conditional_block_sampling_in_search: false

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
