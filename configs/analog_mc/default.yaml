ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 10
n_blocks: 6
n_paths: 1000

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.1
n_eff_values: [15, 30, 50, 80, 150]
local_refine_top_k: 5
nelder_mead_xatol: 0.01
nelder_mead_maxiter: 50

vol_clip_lower: 0.5
vol_clip_upper: 3.0
# v2.4 canonical (promoted 2026-05-20): Cell D + momentum_shrinkage=0.30.
# Pareto winner from the E2-extension sweep, confirmed at canonical resolution
# in runs/analog_mc/20260520T045525Z (76 folds, 66×5 grid, 1000 paths):
#   - Mean CRPS 0.04755 (-6.0% vs v2.3 Cell D canonical 0.05056,
#                         -9.7% vs v2.1 canonical 0.05265)
#   - Per-vol-regime: low 0.0269, mid 0.0371, high 0.0790
#   - sloped_global_pit +0.0216 (3× tighter than v2.3's +0.059)
#   - u_shaped_high_vol_pit +0.963 (well below +2.50 threshold)
#   - acf_seam_degradation -1.121 (unchanged; structural — see _e9_v3b.md)
# See docs/analog_mc/V3_EXPERIMENTS_REPORT.md and docs/analog_mc/_e2_momentum.md.
drift_mode: trailing_momentum
momentum_lookback: 20
momentum_shrinkage: 0.30
conditional_block_sampling: true
conditional_block_sampling_in_search: false  # search uses v1 sampling (cheap); test eval gets conditional

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
