# E1 block-length sweep — bl=5, n_blocks=12.
# Otherwise identical to nasdaq100_fast.yaml. v1 baseline (zero drift, no
# conditional sampling) to isolate block geometry from drift / re-matching.

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 5
n_blocks: 12
n_paths: 500

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.2
n_eff_values: [30, 80]
local_refine_top_k: 3
nelder_mead_xatol: 0.02
nelder_mead_maxiter: 20

vol_clip_lower: 0.5
vol_clip_upper: 3.0
drift_mode: zero
momentum_lookback: 20
momentum_shrinkage: 0.5

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
