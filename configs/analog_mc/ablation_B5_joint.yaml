# B5: A2.1+B1 joint experiment.
# Stacks B1's Platzer–Yiou drift correction onto A2.1's corrwindow distance.
# Both knobs are independent code paths (drift vs distance); the joint
# config is just a 2-line diff from ablation_A2_corrwindow_L100.yaml.
#
# Decision rule (per V4_EXPERIMENTS_PLAN §B5):
# - If failure CRPS improves > max(B1_solo, A2.1_solo) by ≥3%: additive win.
# - If failure CRPS ≈ max(B1_solo, A2.1_solo): non-additive; pick the solo winner.
# - If worse than either solo: knobs interact destructively; investigate.

ticker: NASDAQ100
data_path: data/NASDAQ100.csv
date_col: observation_date
close_col: NASDAQ100

forecast_horizon: 60
block_length: 10
n_blocks: 6
n_paths: 1000

zscore_horizons: [20, 50, 200]

ewma_halflife: 20

train_initial_size: 1000
val_size: 60
test_size: 60

weight_grid_resolution: 0.1
n_eff_values: [15, 30, 50, 80, 150]
local_refine_top_k: 5
nelder_mead_xatol: 0.01
nelder_mead_maxiter: 50

vol_clip_lower: 0.5
vol_clip_upper: 3.0

drift_mode: trailing_momentum
momentum_lookback: 20
momentum_shrinkage: 0.30
conditional_block_sampling: true
conditional_block_sampling_in_search: false

vol_model: ewma

# === B5 = A2.1 + B1, both knobs flipped ===
matcher_distance: corrwindow
corrwindow_length: 100
local_linear_correction: true

pit_n_bins: 20
acf_lags: [1, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50]
vol_regime_quantiles: [0.33, 0.67]

random_seed: 42
runs_dir: runs/analog_mc
