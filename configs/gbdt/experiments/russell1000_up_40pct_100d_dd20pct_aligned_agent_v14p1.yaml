# V1.3 Option B agent-mode run of russell1000 +40%/100d/dd20% (date-aligned).
#
# Companion to the sweep-mode aligned cell
# (results/gbdt/experiments/russell1000_up_40pct_100d_dd20pct_aligned/, CatBoost,
# 3 iters, R-p@1 = 0.550, AUC = 0.821, rows = 177800, Q_days = 200).
#
# Cell: russell1000 UP 40% in 100 trading days with max drawdown 20%.
# Strong-top-1 sweep baseline (R-p@1 = 0.550 >= 0.5) — playbook rule 8 applies:
# the agent must NOT default mcw=10 or the cell-4 mix recipe; explore per-cell.
# Healthy AUC (0.821) — NOT anti-AUC; V1.3 Option A auto-disables won't fire,
# val_brier remains a usable signal.
#
# Scout grid: V1.3 Option B defaults (8 knobs x 4-5 values = 34 + zeroth).
# Per-config timeout bumped to 120s and wall-clock cap to 1800s relative to
# XGBoost defaults (30s / 300s) because this panel is ~40x larger than the
# cell-5 acceptance cell — heavier configs need time to fit honestly.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

experiment_name: russell1000_up_40pct_100d_dd20pct_aligned_agent_v14p1

target:
  universe: russell1000
  direction: up
  threshold_pct: 40
  horizon_days: 100
  max_drawdown: 0.2

split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 200
  min_train_rows_per_ticker: 200

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  scout:
    enabled: true
    per_config_timeout_seconds: 120
    wall_clock_cap_seconds: 1800
  fs_prefit:
    enabled: true
    cliff_pct: 0.01
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
    degenerate_sink_threshold: 1.05
    tie_band: 0.005

random_seed: 42
