# Experiment: sp500_up_50pct_50d_dd25pct_champbase
#
# Phase 3 head-to-head CONTROL (memo _260). Champion regime: TRAILING split (the
# deployed champion's setup, NOT date_aligned) + default auto FS+HP loop (5 iter),
# F1-F16 only. Matched partner of ..._macrochamp (identical except candidates).
# Reference: committed champion sp500_up_50pct_50d_dd25pct_agentloop
# (R-p@1 0.640, R-p@10 0.346; agent_file_protocol).
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25

# trailing split (default) — intentionally no `split:` block.

features:
  candidates: all

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 5
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
