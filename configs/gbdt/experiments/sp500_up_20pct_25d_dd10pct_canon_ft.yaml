# sp500 +20%/25d/dd10% — CANONICAL-PERIODS FINE-TUNE (agent-driven FS+HP).
# Same canonical explicit-boundary split + de-biasing gate as _canon_base; scout + FS-prefit
# then agent-driven FS+HP loop selecting by eval R-Precision@K. --snapshot-end 2026-07-06.
experiment_name: sp500_up_20pct_25d_dd10pct_canon_ft
target:
  universe: sp500
  direction: up
  threshold_pct: 20
  horizon_days: 25
  max_drawdown: 0.10
split:
  mode: date_aligned
  train_start: '2015-01-01'
  val_start: '2022-03-30'
  eval_start: '2023-07-01'
  test_start: '2024-07-01'
  test_end: '2025-06-30'
  min_rows_per_ticker: 2591
features:
  candidates: all
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 5
    plateau_threshold: 0.0001
    degradation_gate: 0.01
  scout:
    enabled: true
  fs_prefit:
    enabled: true
random_seed: 42
date_range:
  end: 2026-07-06
