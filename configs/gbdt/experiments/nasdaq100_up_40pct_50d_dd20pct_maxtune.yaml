# Experiment: nasdaq100_up_40pct_50d_dd20pct_maxtune
# Board campaign round 5 (task #26, nasdaq front): primary purpose is building
# the nasdaq100 MAXIMAL-pool feature matrix (all_fundamentals_vwap_calendar2,
# 310 cols) — the stratified ensemble is then trained manually on the cached
# matrix (scripts/gbdt/stratified_cb_attack.py), matching each incumbent's
# exact published segments. --snapshot-end set at runtime (2026-07-06).
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.20

split:
  mode: date_aligned
  train_start: 2019-01-01

features:
  candidates: all_fundamentals_vwap_calendar2

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 12
    plateau_threshold: 0.0001
    degradation_gate: 0.01

random_seed: 42
