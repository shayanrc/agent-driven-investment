# Experiment: sp500_up_50pct_50d_dd25pct_macrochamp9
#
# Phase 3b (memo _261): re-run the +50% cell — the one where macro HELPED under
# the champion regime (_260: macrochamp 0.360 vs champbase 0.120) — now with the
# HY-OAS credit gap closed. Same champion regime as _260: TRAILING split +
# default auto FS+HP loop (5 iter), candidates all_macro.
#
# The macro panel is now 9 series (45 F17 cols): the 8 real primary-source series
# (Treasury/NY Fed/Yahoo) PLUS a credit-spread PROXY for BAMLH0A0HYM2 — there is
# no free source for the real ICE HY OAS, so it is approximated by
# `-log(HYG_adjclose/IEF_adjclose)` (HY corp ETF vs duration-matched Treasuries,
# which tracks the OAS direction), provider yahoo_credit_proxy.
#
# Question: does adding the credit axis push macrochamp past the 8-series 0.360
# toward the committed champion's R-p@1 0.640?
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25

# trailing split (default) — intentionally no `split:` block.

features:
  candidates: all_macro

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 5
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
