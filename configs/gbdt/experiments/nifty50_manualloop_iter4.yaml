# Hand-driven FS+HP loop — nifty50 UP +10% / 25d / dd5%.
# ITERATION 4 — targeted feature selection at baseline HP.
# HP ceiling confirmed; baseline depth6/lr0.05 = val_brier 0.1642.
# H4: exclude the 191 dead-weight feats (importance <0.01 in baseline model),
# keeping the 88 signal-bearing ones. Tests a GENTLE cut vs fallback blind-cut.
