# Experiment: sp500_up_20pct_50d_dd10pct_ffundtune
# Full FS+HP loop (default auto-callback, 8-iter cap) on the all_fundamentals
# arm — top-3 F18 model from the _274 sweep (by R-p@3 among skill-bearing
# cells; +10%/50d excluded as a diagnosed-null cell per the compound rule).
# date_aligned split matches _274, so the tuned result is directly comparable
# to the sp500_up_20pct_50d_dd10pct_ffund single-fit row (same 2024-H2 test window). Memo _275.
# --snapshot-end set at runtime.
target:
  universe: sp500
  direction: up
  threshold_pct: 20
  horizon_days: 50
  max_drawdown: 0.1

split:
  mode: date_aligned
  train_start: 2019-01-01

features:
  candidates: all_fundamentals

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 8
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
