# Experiment: sp500_up_20pct_25d_dd10pct_macrochampagent
#
# Macro arm of the champion re-baseline head-to-head (memo _262): the champion's
# exact config (min_child_weight=10, single fit, trailing) PLUS the macro family
# (candidates all_macro = F1-F16 + F17 9-series panel incl. the HY-OAS credit
# proxy). IDENTICAL to ..._champ_resnap except features.candidates. Matched window
# + matched HP -> clean "does macro beat the champion?" head-to-head.
target:
  universe: sp500
  direction: up
  threshold_pct: 20
  horizon_days: 25
  max_drawdown: 0.10

features:
  candidates: all_macro

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  hp_starting:
    min_child_weight: 10
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
