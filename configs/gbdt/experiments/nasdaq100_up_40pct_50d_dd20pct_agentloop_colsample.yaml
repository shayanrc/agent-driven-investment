# Variant of nasdaq100_up_40pct_50d_dd20pct_agentloop to test colsample_bytree
# as the iter_2/iter_3 lever on top of FS+mcw=10 (the cell-4 plateau winner).
# plateau_threshold set tight so the runner doesn't early-stop after small
# improvements — we want to see multiple colsample values.
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.2
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 4
    plateau_threshold: 0.0001
    degradation_gate: 0.05
