# Experiment: nasdaq100_up_10pct_100d_dd5pct
#
# Cell: nasdaq100 UP 10% in 100 trading days with max drawdown 5%.
#
# Historical base rate (non-overlapping blocks from EDA scan 2026-05-26,
# nasdaq100 panel, 1990-01-02 to 2026-05-22): 19.698%  (1279 positives
# / 6493 blocks).  Priority rank: #1 of 57 in the
# US sweep.
#
# Sweep-mode params: fs_hp_loop.max_iterations=3. This is a SCREENING
# run; cells that surface meaningful calibration improvement get re-run
# with the full 8-iter loop later.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

target:
  universe: nasdaq100
  direction: up
  threshold_pct: 10
  horizon_days: 100
  max_drawdown: 0.05          # numeric, e.g. 0.05 not "5%"

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
