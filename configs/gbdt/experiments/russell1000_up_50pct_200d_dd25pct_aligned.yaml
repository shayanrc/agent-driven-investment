# Experiment: russell1000_up_50pct_200d_dd25pct_aligned
#
# V1.4 date-aligned variant of the cell — train_start=2019-01-01
# (canonical D2 anchor). Rerun under bug #228 to fix the H>=100
# trailing-anchor test-window-eaten-by-horizon issue (bug #129).
#
#
# Cell: russell1000 UP 50% in 200 trading days with max drawdown 25%.
#
# Historical base rate (non-overlapping blocks from EDA scan 2026-05-26,
# russell1000 panel, 1990-01-02 to 2026-05-22): 9.065%  (2739 positives
# / 30215 blocks).  Priority rank: #19 of 57 in the
# US sweep.
#
# Sweep-mode params: fs_hp_loop.max_iterations=3. This is a SCREENING
# run; cells with meaningful calibration improvement get re-run with
# the full 8-iter loop later.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

target:
  universe: russell1000
  direction: up
  threshold_pct: 50
  horizon_days: 200
  max_drawdown: 0.25

split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 100
  min_train_rows_per_ticker: 200

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
