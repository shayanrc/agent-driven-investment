# russell1000 +40%/100d/dd20% — CANONICAL-PERIODS regime-corrected BASE.
# Default-HP single fit on the canonical evaluation periods (explicit-boundary form).
# Builds the target-agnostic russell1000 canonical-period feature matrix; the +50%/200d
# cell (#53) shares this universe matrix (features are target-agnostic). Same de-biasing
# gate + snapshot as sp500.
experiment_name: russell1000_up_40pct_100d_dd20pct_canon_base
target:
  universe: russell1000
  direction: up
  threshold_pct: 40
  horizon_days: 100
  max_drawdown: 0.20
split:
  mode: date_aligned
  train_start: '2015-01-01'
  val_start: '2022-03-30'
  eval_start: '2023-07-01'
  test_start: '2024-07-01'
  test_end: '2025-06-30'
  min_rows_per_ticker: 2591
features:
  candidates: all
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
date_range:
  end: 2026-07-06
