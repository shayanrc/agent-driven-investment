# nasdaq100_up_10pct_50d_dd5pct_aligned_baccmatch
# Date-aligned MATCHED refit of trailing champion `nasdaq100_up_10pct_50d_dd5pct_b_acceptance_agent`.
# Pins its backend + HP overrides + 190-feature set (build all, exclude the 89 dropped cols); split -> date_aligned
# (train_start 2019-01-01), single fit. Isolates the split effect. --snapshot-end at runtime.
