# Experiment: nasdaq100_up_20pct_100d_dd10pct_aligned
#
# V1.4 date-aligned variant of the cell — train_start=2019-01-01
# (canonical D2 anchor). Rerun under bug #228 to fix the H>=100
# trailing-anchor test-window-eaten-by-horizon issue (bug #129).
#
#
# Cell: nasdaq100 UP 20% in 100 trading days with max drawdown 10%.
#
# Historical base rate (non-overlapping blocks from EDA scan 2026-05-26,
# nasdaq100 panel, 1990-01-02 to 2026-05-22): 18.651%  (1211 positives
# / 6493 blocks).  Priority rank: #5 of 57 in the
# US sweep.
#
# Sweep-mode params: fs_hp_loop.max_iterations=3. This is a SCREENING
# run; cells that surface meaningful calibration improvement get re-run
# with the full 8-iter loop later.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

target:
  universe: nasdaq100
  direction: up
  threshold_pct: 20
  horizon_days: 100
  max_drawdown: 0.10          # numeric, e.g. 0.05 not "5%"

split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 100
  min_train_rows_per_ticker: 200

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
