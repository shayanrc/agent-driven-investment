# Experiment: sp500_up_50pct_100d_dd25pct_swmacro
# Macro-lattice sweep (+macro arm), memo _263.
# Matched fixed config (xgboost, min_child_weight=10, single fit) so base vs +macro
# differ ONLY in features.candidates -> clean per-cell macro delta (avoids the _260
# default-auto per-arm HP confound). trailing split, snapshot supplied at runtime.
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 100
  max_drawdown: 0.25

features:
  candidates: all_macro

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  hp_starting:
    min_child_weight: 10
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
