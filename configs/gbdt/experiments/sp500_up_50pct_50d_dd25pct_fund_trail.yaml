# Experiment: sp500_up_50pct_50d_dd25pct_fund_trail
#
# TRAILING-window fundamentals arm for the F18 SECOND-window validation
# (memo _273). Identical to ..._base_v2_trail EXCEPT features.candidates:
# all_fundamentals (F1–F16 + F18). No `split:` block ⇒ trailing-anchor mode.
# The A/B delta vs ..._base_v2_trail on this recent window is the replication
# test of _272's date-aligned win. max_iterations: 1 (single fit) keeps HP
# matched to the control — the only difference is the +9 F18 columns.
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25

features:
  candidates: all_fundamentals   # F1–F16 + F18; 'all' untouched

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
