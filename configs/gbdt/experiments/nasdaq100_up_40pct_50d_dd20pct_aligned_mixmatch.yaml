# nasdaq100_up_40pct_50d_dd20pct_aligned_mixmatch
# Date-aligned MATCHED refit of trailing champion `nasdaq100_up_40pct_50d_dd20pct_agentloop_mix`.
# Pins its backend + HP overrides + 30-feature set; split -> date_aligned
# (train_start 2019-01-01), single fit. Isolates the split effect. --snapshot-end at runtime.
experiment_name: nasdaq100_up_40pct_50d_dd20pct_aligned_mixmatch
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.2
split:
  mode: date_aligned
  train_start: '2019-01-01'
features:
  candidates:
  - index_return_50
  - index_return_200
  - realized_vol_200
  - index_vol_20
  - drawdown_20
  - runup_50
  - runup_200
  - index_drawdown_200
  - index_runup_50
  - index_runup_200
  - dollar_move_xs_rank
  - returns_skew_200
  - beta_100
  - parkinson_50
  - parkinson_200
  - garman_klass_50
  - garman_klass_100
  - garman_klass_200
  - sma_distance_200
  - vol_xs_rank_50
  - vol_xs_zscore_50
  - vol_xs_rank_100
  - vol_xs_zscore_100
  - return_xs_zscore_200
  - vol_xs_rank_200
  - moy_sin
  - realized_vol_zscore_200
  - vol_xs_zscore_200_outside_band_2
  - stock_return_zscore_100_outside_band_1
  - realized_vol_zscore_200_outside_band_1
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  hp_starting:
    min_child_weight: 5
    colsample_bytree: 0.5
    gamma: 0.5
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
