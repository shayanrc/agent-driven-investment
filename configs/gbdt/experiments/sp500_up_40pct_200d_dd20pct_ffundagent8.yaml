# Experiment: sp500_up_40pct_200d_dd20pct_ffundagent8
# 1-shot of the ffundagent loop iter-8 config (155-col cliff-cut pool, lambda 10,
# min_child_weight 3) - the eval-book dominator the val-argmin finalizer passed
# over. Mini agent-protocol run: iter_0 default -> decision prunes to the exact
# iter-8 pool + HP -> iter_1 = the config; iter_1 takes val argmin -> finalizer
# emits it. Test adjudicates the val-vs-eval disagreement. Memo _276.
target:
  universe: sp500
  direction: up
  threshold_pct: 40
  horizon_days: 200
  max_drawdown: 0.20

split:
  mode: date_aligned
  train_start: 2019-01-01

features:
  candidates: all_fundamentals

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.25
    tie_band: 0.0

random_seed: 42
