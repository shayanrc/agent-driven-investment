# Experiment: sp500_up_50pct_50d_dd25pct_base_v2_trail
#
# TRAILING-window control for the F18 fundamentals SECOND-window validation
# (memo _273). Identical to ..._base_v2 EXCEPT the split: no `split:` block ⇒
# the default trailing-anchor mode (test = most recent labelable data), the
# genuinely different period from _272's date-aligned 2024-H2 test window.
# Pairs with ..._fund_trail; A/B isolates F18 within this window.
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25

features:
  candidates: all          # F1–F16 (279 cols)

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
