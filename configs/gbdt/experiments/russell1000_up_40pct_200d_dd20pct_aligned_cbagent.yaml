# CatBoost agent-tune of russell1000 +40%/200d/dd20% (date-aligned). V1.5_TBD #1.
#
# _268 found the BACKEND (CatBoost) dominates at H=200 — CatBoost-sweep beat the
# agent-tuned XGBoost on test top-1/@3 in all 3 cells, and the agent's eval-R-p@1
# loop on XGBoost was high-variance (on THIS cell it OVER-FIT: XGBoost-default
# test @1=0.633 -> agent-tuned 0.447). This run tests whether tuning the ROBUST
# backend (CatBoost) via agent_file_protocol can BEAT the cheap CatBoost sweep.
#
# Bar to beat (CatBoost sweep = *_aligned_resnap, current vintage, same window):
#   test R-p@1=0.740 @3=0.523 @5=0.515 @10=0.444 @20=0.424 (base 0.236; eval @1=0.805).
# XGBoost agent (the _267 cell) test @1=0.447 — the cautionary baseline.
#
# The V1.3 scout translates XGBoost-vocab HP -> CatBoost (max_depth->depth,
# eta->learning_rate, colsample_bytree->rsm, min_child_weight->min_data_in_leaf,
# alpha->l2_leaf_reg; gamma dropped — no CatBoost analog). Scout timeouts bumped
# (CatBoost trains slower than XGBoost).
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

experiment_name: russell1000_up_40pct_200d_dd20pct_aligned_cbagent

target:
  universe: russell1000
  direction: up
  threshold_pct: 40
  horizon_days: 200
  max_drawdown: 0.20

split:
  mode: date_aligned
  train_start: 2018-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 300
  min_train_rows_per_ticker: 200
  min_rows_per_ticker: 2000

backend:
  library: catboost
  calibration_method: conditional_isotonic
  scout:
    enabled: true
    per_config_timeout_seconds: 300
    wall_clock_cap_seconds: 3600
  fs_prefit:
    enabled: true
    cliff_pct: 0.01
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
    degenerate_sink_threshold: 1.05
    tie_band: 0.005

random_seed: 42
