# Experiment: nifty500_up_20pct_200d_dd10pct_ffund
# Fundamentals horizon×target sweep (+fund arm, date_aligned), memo _274.
# IDENTICAL config to the _272/_273 A/B (xgboost, default HP, single fit): base
# and +fund differ ONLY in features.candidates, so each cell's fund-minus-base
# delta is a clean read of the F18 contribution at this (threshold, horizon).
# --snapshot-end set at runtime.
target:
  universe: nifty500
  direction: up
  threshold_pct: 20
  horizon_days: 200
  max_drawdown: 0.1

split:
  mode: date_aligned
  train_start: 2015-01-01
  train_rows: 1787
  min_rows_per_ticker: 2487

features:
  candidates: all_fundamentals

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
