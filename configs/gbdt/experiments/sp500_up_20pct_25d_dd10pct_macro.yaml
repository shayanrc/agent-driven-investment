# Experiment: sp500_up_20pct_25d_dd10pct_macro
#
# Macro-augmented variant (F1–F16 + F17 FRED macro) — A/B partner of
# ..._base_v2 on the +20%/25d cell. IDENTICAL except features.candidates:
# all_macro. Test R-Precision@K delta vs base_v2 isolates the macro signal.
target:
  universe: sp500
  direction: up
  threshold_pct: 20
  horizon_days: 25
  max_drawdown: 0.10

split:
  mode: date_aligned
  train_start: 2019-01-01

features:
  candidates: all_macro

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01

random_seed: 42
