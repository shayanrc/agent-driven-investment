# Extends the colsample variant — picks up at FS+mcw=10+colsample=0.5 (the
# col_sample-variant best), then tests gamma (min_split_loss) as the new knob.
# Same plateau-disabled spec so we can iterate multiple gamma values.
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.2
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
