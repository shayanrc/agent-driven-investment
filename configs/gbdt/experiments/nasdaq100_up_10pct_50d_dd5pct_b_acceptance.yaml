experiment_name: nasdaq100_up_10pct_50d_dd5pct_b_acceptance

target:
  universe: nasdaq100
  direction: up
  threshold_pct: 10
  horizon_days: 50
  max_drawdown: 0.05

backend:
  library: xgboost                                # tiny-model regime cell — XGBoost per _211.
  calibration_method: conditional_isotonic
  scout:
    enabled: true
    # All knob grids + caps + oracle locked at runner defaults.
  fs_prefit:
    enabled: true
    cliff_pct: 0.01
  # fs_hp_loop omitted -> default mode + runner defaults (max_iterations etc.).

random_seed: 42
