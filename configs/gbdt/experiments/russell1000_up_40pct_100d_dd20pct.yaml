# Experiment: russell1000_up_40pct_100d_dd20pct
#
# Cell: russell1000 UP 40% in 100 trading days with max drawdown 20%.
#
# Historical base rate (non-overlapping blocks from EDA scan 2026-05-26,
# russell1000 panel, 1990-01-02 to 2026-05-22): 5.829%  (3563 positives
# / 61122 blocks).  Priority rank: #27 of 57 in the
# US sweep.
#
# Sweep-mode params: fs_hp_loop.max_iterations=3. This is a SCREENING
# run; cells with meaningful calibration improvement get re-run with
# the full 8-iter loop later.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

target:
  universe: russell1000
  direction: up
  threshold_pct: 40
  horizon_days: 100
  max_drawdown: 0.2

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
