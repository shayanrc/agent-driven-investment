# Experiment: russell1000_up_20pct_100d_dd10pct_aligned
#
# V1.4 date-aligned variant of the cell — train_start=2019-01-01
# (canonical D2 anchor). Rerun under bug #228 to fix
# the H>=100 trailing-anchor test-window-eaten-by-horizon issue (bug #129).
#
# test_rows=200 (= horizon_days+100) gives ~100 usable test rows per ticker;
# the trailing horizon_days=100 rows of the test segment have NaN labels and are dropped.
#
#
# Cell: russell1000 UP 20% in 100 trading days with max drawdown 10%.
#
# Historical base rate (non-overlapping blocks from EDA scan 2026-05-26,
# russell1000 panel, 1990-01-02 to 2026-05-22): 15.872%  (9701 positives
# / 61122 blocks).  Priority rank: #10 of 57 in the
# US sweep.
#
# Sweep-mode params: fs_hp_loop.max_iterations=3. This is a SCREENING
# run; cells with meaningful calibration improvement get re-run with
# the full 8-iter loop later.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.

target:
  universe: russell1000
  direction: up
  threshold_pct: 20
  horizon_days: 100
  max_drawdown: 0.1

split:
  mode: date_aligned
  train_start: 2019-01-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 200
  min_train_rows_per_ticker: 200

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
