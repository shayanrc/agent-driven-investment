# Mix variant — tests "tempered regularization" mcw=5 + colsample=0.5 + gamma=0.5
# vs gamma variant's mcw=10 + colsample=0.5 + gamma=1.0. Hypothesis: mcw=10 was
# OVER-regularizing top-1; backing off to mcw=5 while keeping col_sample+gamma
# might find the sweet spot between cell-4-colsample (best top-1) and cell-4-gamma
# (best K=10/20).
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.2
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 16
    plateau_threshold: 0.0001
    degradation_gate: 0.05
