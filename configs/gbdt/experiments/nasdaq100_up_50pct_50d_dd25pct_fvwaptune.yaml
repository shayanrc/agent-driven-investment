# Experiment: nasdaq100_up_50pct_50d_dd25pct_fvwaptune
# V1.8 VWAP finetune (_282): auto-loop FS+HP on a strong-absolute cell
# (R-p@3>0.5 & AUC>0.5). callback_mode agent_file_protocol (user-directed 2026-07-08); val_brier not
# degenerate); iter 0 == the single-fit so every delta is tuned-vs-untuned.
# Watch the _276/_280 anti-selection pattern (bulk gains flattening the test book).
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25

split:
  mode: date_aligned
  train_start: 2019-01-01

features:
  candidates: all_fundamentals_vwap

backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 10
    plateau_threshold: 0.0001
    degradation_gate: 0.01

random_seed: 42
