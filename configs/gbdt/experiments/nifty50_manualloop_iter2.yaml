# Hand-driven FS+HP loop — nifty50 UP +10% / 25d / dd5%.
# ITERATION 2 — shallower-tree test (maps the depth response curve).
#
# iter0 (depth6, l2=3.0): val_brier 0.1642, early-stop never fired (no overfit).
# iter1 (depth8, l2=1.5): val_brier 0.1652, early-stop @ tree 48 (overfits fast).
# Read: depth 8 is the WRONG direction; signal is low-complexity.
#
# Hypothesis H2: shallower trees (depth 4) reduce variance and may generalize
# better for a low-complexity signal. Change ONLY depth (6 -> 4); hold l2 3.0,
# lr 0.05, all 279 feat at the iter-0 baseline so the delta is attributable to
# depth alone. Combined with iter0/iter1 this gives a 3-point depth curve {4,6,8}.
# Watch: val_brier vs 0.1642; does early-stop fire later (smoother fit)?
#
# max_iterations: 1 -> single clean fit, no fallback callback fires.

target:
  universe: nifty50
  direction: up
  threshold_pct: 10
  horizon_days: 25
  max_drawdown: 0.05

backend:
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 1
  hp_starting:
    iterations: 1000
    learning_rate: 0.05
    depth: 4
    l2_leaf_reg: 3.0
    min_data_in_leaf: 1
    rsm: 1.0
    bootstrap_type: Bayesian
    bagging_temperature: 1.0
    random_strength: 1.0
    boosting_type: Ordered
    early_stopping_rounds: 75

random_seed: 42
