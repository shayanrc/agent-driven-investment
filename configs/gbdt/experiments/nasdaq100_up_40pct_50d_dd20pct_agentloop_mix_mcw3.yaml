# Mix-recipe push on cell-4 (nasdaq100_up_40pct_50d_dd20pct).
# Tests whether dropping mcw from 5 to 3 (keeping colsample=0.5 + gamma=0.5)
# improves on the mix R-p@1=0.667 winner. Asks whether weaker leaf-mass
# regularization with the same column-sampling + split-quality threshold
# unlocks additional top-1 skill.
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 40
  horizon_days: 50
  max_drawdown: 0.2
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: agent_file_protocol
    max_iterations: 4
    plateau_threshold: 0.0001
    degradation_gate: 0.05
