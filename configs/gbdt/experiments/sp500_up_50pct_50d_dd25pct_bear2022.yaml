experiment_name: sp500_up_50pct_50d_dd25pct_bear2022
# _016 real-bear OOS test: retrain the sp500 +50%/50d champion with a pre-bear
# cutoff so the TEST segment is the 2022 bear (genuinely out-of-sample — the model
# never sees 2022). Split anchors forward from train_start: 800 train + 400 val +
# 200 eval + 250 test trading days. train_start 2016-06 → test ≈ all of 2022.
target:
  universe: sp500
  direction: up
  threshold_pct: 50
  horizon_days: 50
  max_drawdown: 0.25
split:
  mode: date_aligned
  train_start: 2016-06-01
  train_rows: 800
  val_rows: 400
  eval_rows: 200
  test_rows: 250
  min_train_rows_per_ticker: 200
  min_rows_per_ticker: 1750
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    max_iterations: 3
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
date_range:
  end: 2022-12-31
