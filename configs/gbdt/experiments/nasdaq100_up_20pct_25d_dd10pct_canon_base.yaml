# nasdaq100_up_20pct_25d_dd10pct_canon_base — #56 champion-matrix PILOT base (matched baseline).
# The deployed sp500 +20%/25d/dd10% champion cell replicated on nasdaq100: token `all`
# (matched to the sp500 champion), canonical explicit-boundary split, min_rows 2591.
# Default-HP single fit; the finetune arm applies the sp500 champion's adopted HP.
experiment_name: nasdaq100_up_20pct_25d_dd10pct_canon_base
target:
  universe: nasdaq100
  direction: up
  threshold_pct: 20
  horizon_days: 25
  max_drawdown: 0.10
split:
  mode: date_aligned
  train_start: '2015-01-01'
  val_start: '2022-03-30'
  eval_start: '2023-07-01'
  test_start: '2024-07-01'
  test_end: '2025-06-30'
  min_rows_per_ticker: 2591
features:
  candidates: all
backend:
  library: xgboost
  calibration_method: conditional_isotonic
  fs_hp_loop:
    callback_mode: default
    max_iterations: 1
    plateau_threshold: 0.005
    degradation_gate: 0.01
random_seed: 42
date_range:
  end: 2026-07-06
