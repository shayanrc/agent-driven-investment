# gbdt — v1 global defaults
#
# Per-experiment specs in configs/gbdt/experiments/<name>.yaml override
# only what they care about; everything else falls through to this file.
#
# Schema reference: docs/gbdt/EXPERIMENT_SPEC.md.
# Architecture: docs/gbdt/V1_PLAN.md.
# HP semantics: docs/gbdt/CATBOOST_HP_REFERENCE.md.

# ---------------------------------------------------------------------------
# Universe presets. v1 pre-registers nifty50 + the broader NSE universes
# (nifty100, nifty_midcap_150, nifty500) and the US universes (sp500,
# nasdaq100, russell1000). Inline ad-hoc baskets are registered on first
# use by the /gbdt-experiment skill's universe self-service flow — see
# docs/gbdt/V1_PLAN.md Stage 1 § "Universe self-service" and
# .claude/skills/gbdt-experiment/SKILL.md § "Pre-flight".
#
# An unknown universe is a hard error in gbdt.data.universe_metadata —
# no silent fallback to NIFTY-style defaults. See PR #100 for the why:
# Exp 2 (nifty100 +10%/20d) computed every macro feature against NIFTY:50
# instead of NIFTY:100 because the runner masked a missing block.
#
# Schema (see docs/data_pipelines/universe_yaml_spec.md for the full spec):
#   source                — repo-relative path to the constituent YAML.
#   index_ticker          — benchmark identifier in the data_pipelines cache;
#                           drives F1/F5/F9/F9b macro features.
#   annualization_factor  — trading days per year (NSE=250, US=252);
#                           propagated into the feature builder.
# ---------------------------------------------------------------------------
