# ---------------------------------------------------------------------------
# Walk-forward split. Per-stock row budget: train + val + eval + test = 1600.
# Tickers below min_rows_per_ticker are dropped from the panel.
# ---------------------------------------------------------------------------
split:
  train_rows: 800                    # where the model fits
  val_rows: 400                      # where CatBoost early-stops + where Spiegelhalter Z is run
  eval_rows: 200                     # held-out segment; headline metrics computed here
  test_rows: 100                     # final sanity-check segment beyond eval
  n_folds: 1                         # single-fold default; specs can override
  min_rows_per_ticker: 1600          # JIOFIN (578) and MAXHEALTH (1322) excluded by this

# ---------------------------------------------------------------------------
# Features. Pool = all 279 candidate columns across 16 families (see
# V1_PLAN.md Stage 2). The agent prunes per-iteration inside the FS+HP loop.
# ---------------------------------------------------------------------------
features:
  candidates: all                    # "all" = 279 cols across F1..F16
  exclude: []                        # spec can list explicit names or globs
  lookback_windows: [5, 10, 20, 50, 100, 200]

# ---------------------------------------------------------------------------
# Backend config. v1 = catboost only.
# ---------------------------------------------------------------------------
backend:
  library: catboost                  # v1.1 may add lightgbm / xgboost behind same contract

  # Calibration policy. Default = conditional isotonic gated by Spiegelhalter Z.
  # Options: native | conditional_isotonic | isotonic_always | platt
  # (see docs/gbdt/EXPERIMENT_SPEC.md § Calibration).
  calibration_method: conditional_isotonic
  calibration_z_threshold: 2.0       # |z| < this -> ship native; else apply isotonic

  # FS+HP loop config. Agent reads diagnostic bundle per iteration; bounded
  # by max_iterations; inner-stops on plateau or degradation.
  fs_hp_loop:
    max_iterations: 8                # hard cap
    plateau_threshold: 0.005         # absolute val Brier improvement floor over last 2 iter
    degradation_gate: 0.01           # 1% multiplicative degrade from best-seen val Brier -> stop
    # L1 from _187: absolute val-Brier tie band for best-checkpoint selection.
    # Configs whose val Brier falls within [min_val_brier, min_val_brier + tie_band]
    # are "tied with best"; among ties prefer lower train-val gap, then |Spiegelhalter
    # Z| closer to 0. Default = unset -> 0.5 * plateau_threshold (0.0025). Set to 0.0
    # to disable tie-breaking (revert to strict val-Brier argmin).
    # tie_band: 0.0025

  # Iteration-0 HP starting values. The agent starts here and explores
  # bounded by the ranges in CATBOOST_HP_REFERENCE.md per parameter.
  # Per-experiment specs override individual keys via backend.hp_starting.
  hp_starting:
    iterations: 1000
    learning_rate: 0.05              # explicit value; otherwise CatBoost auto-derives
    depth: 6
    l2_leaf_reg: 3.0
    min_data_in_leaf: 1
    rsm: 1.0
    bootstrap_type: Bayesian
    bagging_temperature: 1.0
    random_strength: 1.0
    boosting_type: Ordered           # ordered boosting; ~2-3x slower than Plain but better on small data
    early_stopping_rounds: 75
    # auto_class_weights left unset by default; per-cell guidance in CATBOOST_HP_REFERENCE.md § 5

  # Pinned HPs (never overridable from a spec; see V1_PLAN.md Stage 4).
  hp_pinned:
    has_time: true                   # mandatory for walk-forward correctness
    loss_function: Logloss
    eval_metric: BrierScore
    custom_metric: [Logloss, BrierScore, AUC]

# ---------------------------------------------------------------------------
# Global seed. Pinned across CatBoost, NumPy, and any sampling in the
# diagnostic bundle generator. Sweep only for explicit seed-variance work.
# ---------------------------------------------------------------------------
random_seed: 42

# ---------------------------------------------------------------------------
# Artifact roots.
# ---------------------------------------------------------------------------
artifacts:
  experiment_dir: results/gbdt/experiments    # checked-in per-experiment artifact dirs
  runs_dir: runs/gbdt                          # gitignored raw per-iter tempfiles
  headline_data_dir: results/gbdt/data         # per [[project-results-layout]]
